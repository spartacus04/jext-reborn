name: 'Build Tauri'
# This workflow build a Tauri app for all platforms and upload the binaries as artifacts

on:
  schedule:
    - cron: '00 00 * * 0'
  push:
    branches:
      - gh-pages
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Prepare Tauri
        run: |
          bun run scripts/append-hash.ts

      - name: Download FFmpeg, FFprobe and YT-DLP binaries
        env:
          JEXT_TARGET_TRIPLE: ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || matrix.args == '--target x86_64-apple-darwin' && 'x86_64-apple-darwin' || matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || '' }}
        run: bun run scripts/download-ffmpeg.ts

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        with:
          args: ${{ matrix.args }} # was missing: the Intel job built the arm64 app
        env:
          TAURI_CONFIG: ${{ matrix.args == '--target aarch64-apple-darwin' && '{"bundle":{"externalBin":["bin/ffmpeg-darwin-arm64","bin/ffprobe-darwin-arm64","bin/yt-dlp-macos-aarch64"]}}' || matrix.args == '--target x86_64-apple-darwin' && '{"bundle":{"externalBin":["bin/ffmpeg-darwin-x64","bin/ffprobe-darwin-x64","bin/yt-dlp-macos-x86_64"]}}' || matrix.platform == 'windows-latest' && '{"bundle":{"externalBin":["bin/ffmpeg-win32-x64","bin/ffprobe-win32-x64","bin/yt-dlp-windows"]}}' || '{"bundle":{"externalBin":["bin/ffmpeg-linux-x64","bin/ffprobe-linux-x64","bin/yt-dlp-linux"],"linux":{"rpm":{"compression":"none"}}}}' }}

      # archive: false uploads each file as-is (no zip), so the download keeps its
      # extension. The artifact name is the file name itself, and only one file per
      # step is allowed. retention-days is only a fallback (weekly cron + 2 days).
      - name: Upload macOS arm64 .dmg
        if: matrix.platform == 'macos-latest' && matrix.args == '--target aarch64-apple-darwin'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          archive: false
          retention-days: 9
          if-no-files-found: error

      - name: Upload macOS Intel .dmg
        if: matrix.platform == 'macos-latest' && matrix.args == '--target x86_64-apple-darwin'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          archive: false
          retention-days: 9
          if-no-files-found: error

      - name: Upload .deb
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/**/release/bundle/deb/*.deb
          archive: false
          retention-days: 9
          if-no-files-found: error

      - name: Upload .rpm
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/**/release/bundle/rpm/*.rpm
          archive: false
          retention-days: 9
          if-no-files-found: error

      - name: Upload .AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/**/release/bundle/appimage/*.AppImage
          archive: false
          retention-days: 9
          if-no-files-found: error

      - name: Upload .msi
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/**/release/bundle/msi/*.msi
          archive: false
          retention-days: 9
          if-no-files-found: error

      - name: Upload .exe
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/**/release/bundle/nsis/*.exe
          archive: false
          retention-days: 9
          if-no-files-found: error

  cleanup-old-artifacts:
    needs: publish-tauri # skipped unless every matrix job succeeded
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from previous runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            | jq -r --argjson run "$RUN_ID" '
                .artifacts[]
                | select(.workflow_run.id != $run)
                | select(.name | test("\\.(dmg|deb|rpm|AppImage|msi|exe)$"))
                | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/$REPO/actions/artifacts/{}"